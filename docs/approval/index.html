<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Approval｜對話畫面草稿</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="phone">
    <header class="top">
      <h1>簽核｜請假申請</h1>
      <p>畫面草稿 · 功能稍後再接</p>
    </header>

    <main class="chat" aria-label="對話草稿">
      <!-- 申請人訊息：框內嵌欄位標籤 -->
      <article class="bubble me">
        <div class="meta"><strong>王小明</strong><time>17:02</time></div>
        <p>請幫我簽一下，明天上午請假。</p>
        <div class="tags">
          <div class="tag"><span>假別：</span><em>事假</em></div>
          <div class="tag"><span>日期：</span><em>明天（1 天）</em></div>
        </div>
      </article>

      <!-- 簽核槽 1 -->
      <article class="bubble">
        <div class="meta"><strong>簽核</strong><time>17:10</time></div>
        <div class="tags">
          <div class="tag approver">
            <span>Approver1：</span><em>林主管</em>
          </div>
          <div class="tag wait">
            <span>（等待申請人送出）</span>
          </div>
        </div>
      </article>

      <!-- 簽核槽 2＋申請人回覆並列感：分開兩泡 -->
      <article class="bubble">
        <div class="meta"><strong>簽核</strong><time>17:10</time></div>
        <div class="tags">
          <div class="tag approver">
            <span>Approver2：</span><em>嚴協理</em>
          </div>
          <div class="tag wait">
            <span>（等待申請人送出）</span>
          </div>
        </div>
      </article>

      <article class="bubble me">
        <div class="meta"><strong>王小明</strong><time>17:12</time></div>
        <p>有，陳美玲已同意代理。</p>
      </article>
    </main>

    <footer class="dock">
      <form class="composer" id="composer" action="#">
        <input type="text" placeholder="輸入一段訊息" readonly />
        <button type="button">傳送</button>
      </form>
    </footer>
  </div>
  <script>
    // 畫面草稿：刻意不做功能
    document.getElementById("composer").addEventListener("submit", (e) => e.preventDefault());
  </script>
</body>
</html>
