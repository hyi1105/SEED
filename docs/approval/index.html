<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Approval｜簽核對話</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="topbar-text">
        <h1 id="main-title">簽核｜請假申請</h1>
        <p class="sub" id="main-sub">純對話 · 框內欄位受控</p>
      </div>
      <div class="topbar-actions">
        <select id="login-select" aria-label="登入身分"></select>
        <button type="button" class="ghost" id="btn-reset" title="重設">重設</button>
      </div>
    </header>

    <div class="thread" aria-label="簽核對話">
      <div class="boxes" id="boxes"></div>
    </div>

    <footer class="dock">
      <div class="compose-fields" id="compose-fields"></div>
      <form class="composer" id="composer">
        <input type="text" id="msg" placeholder="輸入一段訊息" autocomplete="off" />
        <button type="submit">傳送</button>
      </form>
      <div class="dock-meta">
        <label class="teams-opt">
          <input type="checkbox" id="teams-notify" />
          Teams 通知
        </label>
        <span id="status-chip">draft</span>
      </div>
    </footer>
  </div>

  <div class="sheet hidden" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-card">
      <h3 id="sheet-title">操作</h3>
      <p id="sheet-desc"></p>
      <ul id="sheet-actions"></ul>
      <button type="button" class="ghost" id="sheet-close">關閉</button>
    </div>
  </div>

  <div class="sheet hidden" id="profile" role="dialog" aria-modal="true">
    <div class="sheet-card">
      <h3 id="profile-title">個人資料</h3>
      <dl id="profile-body"></dl>
      <button type="button" class="ghost" id="profile-close">關閉</button>
    </div>
  </div>

  <div class="sheet hidden" id="pick-person" role="dialog" aria-modal="true">
    <div class="sheet-card">
      <h3 id="pick-title">選人</h3>
      <p id="pick-desc"></p>
      <ul id="pick-list"></ul>
      <button type="button" class="ghost" id="pick-close">取消</button>
    </div>
  </div>

  <div class="toast hidden" id="toast" role="status"></div>
  <script src="./app.js" type="module"></script>
</body>
</html>
