<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Approval｜請假申請書</title>
  <link rel="stylesheet" href="./styles.css?v=clean1" />
</head>
<body>
  <div class="stage">
    <article class="a4" id="doc">

      <h2 class="doc-title">請假申請書</h2>

      <section class="block">
        <p class="para">
          申請人
          <input class="blank" data-bind="applicant" value="王小明" />
          因
          <input class="blank" data-bind="leave_type" value="事假" />
          ，自
          <input class="blank wide" data-bind="leave_date" value="明天" />
          起請假
          <input class="blank narrow" data-bind="days" value="1" />
          天，代理人為
          <input class="blank" data-bind="agent" value="陳美玲" />
          。
        </p>
      </section>

      <section class="block">
        <p class="para narrate">
          系統已排程郵件通知簽核人。此關可簽核、可退回、可換代理人；申請欄位送出後改為唯讀。
        </p>
        <p class="para narrate">
          變更紀錄：假別由「特休」改為「事假」；日期由空白改為「明天」；天數為「1」。
        </p>
      </section>

      <section class="block hanko-block">
        <p class="para narrate hanko-lead">簽核印鑑欄</p>
        <table class="inkan-table">
          <thead>
            <tr>
              <th scope="col">協理</th>
              <th scope="col">課長</th>
              <th scope="col">代理人</th>
              <th scope="col">申請</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="pending">
                <div class="inkan-stamp tilt-0 empty"><span class="inkan-name">嚴</span></div>
                <div class="inkan-time wait">尚未蓋印</div>
              </td>
              <td class="done">
                <div class="inkan-stamp tilt-1"><span class="inkan-name">林</span></div>
                <div class="inkan-approve">APPROVE</div>
                <div class="inkan-time">08-04 10:18</div>
              </td>
              <td class="done">
                <div class="inkan-stamp tilt-2"><span class="inkan-name">陳</span></div>
                <div class="inkan-approve">確認</div>
                <div class="inkan-time">08-04 09:55</div>
              </td>
              <td class="done">
                <div class="inkan-stamp tilt-3"><span class="inkan-name">王</span></div>
                <div class="inkan-approve">申請</div>
                <div class="inkan-time">08-04 09:40</div>
              </td>
            </tr>
          </tbody>
        </table>
      </section>

    </article>
  </div>
  <script src="./app.js?v=clean1"></script>
</body>
</html>
