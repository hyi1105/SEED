<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>請假系統 · Show — SEED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2420;
      --muted: #5a6e65;
      --line: rgba(26, 36, 32, 0.12);
      --brand: #0c5c4d;
      --brand-2: #178f72;
      --paper: #fffcf7;
      --paper-edge: #e8e0d2;
      --soft: #d9efe7;
      --user: #1f6fbf;
      --guide: #0c5c4d;
      --manager: #b45309;
      --hr: #6d4a9e;
      --font-d: "Fraunces", "Noto Sans TC", serif;
      --font-b: "Noto Sans TC", sans-serif;
      --font-ui: "Outfit", "Noto Sans TC", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font-family: var(--font-b);
      color: var(--ink);
      background: #cfdcd5;
      overflow: hidden;
    }
    .app {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr minmax(150px, auto);
    }
    .top {
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.55rem 0.85rem;
      background: rgba(247, 250, 248, 0.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .top a.seed {
      text-decoration: none;
      color: var(--brand);
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.3rem 0.55rem;
      border-radius: 999px;
      background: var(--soft);
    }
    .brand { min-width: 0; flex: 1; }
    .brand .eyebrow {
      margin: 0;
      font-family: var(--font-ui);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--brand);
      font-weight: 600;
    }
    .brand h1 {
      margin: 0;
      font-family: var(--font-d);
      font-size: 1.2rem;
      letter-spacing: -0.02em;
      line-height: 1.15;
      font-weight: 700;
    }
    .top-actions { display: flex; gap: 0.35rem; align-items: center; }
    .top-actions button, .top-actions a.chip {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 0.3rem 0.7rem;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      text-decoration: none;
    }
    .stage-wrap {
      position: relative;
      min-height: 0;
      overflow: auto;
      padding: 0.85rem 0.85rem 1rem;
      background:
        radial-gradient(800px 360px at 12% 0%, rgba(23, 143, 114, 0.16), transparent 55%),
        radial-gradient(700px 320px at 100% 100%, rgba(180, 83, 9, 0.08), transparent 50%),
        linear-gradient(165deg, #e4efe9, #d2e0d8 55%, #c5d6cc);
    }
    .form-sheet {
      width: min(560px, 100%);
      margin: 0 auto;
      background: linear-gradient(180deg, #fffefb 0%, var(--paper) 100%);
      border: 1px solid var(--paper-edge);
      border-radius: 4px;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.8) inset,
        0 18px 40px rgba(26, 36, 32, 0.14);
      padding: 1.15rem 1.2rem 1.35rem;
      position: relative;
      animation: sheet-in 0.5s ease both;
    }
    @keyframes sheet-in {
      from { opacity: 0; transform: translateY(10px) scale(0.985); }
      to { opacity: 1; transform: none; }
    }
    .form-sheet::before {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
      border-radius: 4px 4px 0 0;
    }
    .form-title {
      margin: 0.15rem 0 0.15rem;
      font-family: var(--font-d);
      font-size: 1.45rem;
      letter-spacing: -0.02em;
      text-align: center;
    }
    .form-sub {
      margin: 0 0 1rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .section {
      display: none;
      margin-bottom: 0.95rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px dashed rgba(26, 36, 32, 0.12);
    }
    .section.open { display: block; animation: fade-up 0.35s ease both; }
    .section:last-of-type { border-bottom: 0; margin-bottom: 0.4rem; }
    .section-label {
      margin: 0 0 0.5rem;
      font-family: var(--font-ui);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--brand);
    }
    .fields { display: grid; gap: 0.45rem; }
    .field {
      display: none;
      grid-template-columns: 5.2rem minmax(0, 1fr);
      gap: 0.45rem;
      align-items: center;
      padding: 0.4rem 0.5rem;
      border-radius: 10px;
      border: 1.5px solid transparent;
      transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
    }
    .field.open { display: grid; animation: fade-up 0.35s ease both; }
    .field.focus {
      border-color: color-mix(in srgb, var(--brand) 55%, white);
      background: rgba(12, 92, 77, 0.06);
      box-shadow: 0 0 0 3px rgba(12, 92, 77, 0.08);
    }
    .field-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
    }
    .field.focus .field-label { color: var(--brand); }
    .field-value {
      min-height: 1.7rem;
      padding: 0.35rem 0.55rem;
      border-radius: 8px;
      border: 1px solid rgba(26, 36, 32, 0.12);
      background: #fff;
      font-size: 0.95rem;
      line-height: 1.35;
    }
    .field-value.empty {
      color: #a8b5af;
      font-style: italic;
      font-size: 0.85rem;
    }
    .field-value.typing::after {
      content: "▌";
      margin-left: 1px;
      animation: blink 0.8s step-end infinite;
      color: var(--brand);
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .submit-row {
      display: none;
      justify-content: flex-end;
      margin-top: 0.35rem;
    }
    .submit-row.open { display: flex; }
    .submit-btn {
      border: 0;
      border-radius: 10px;
      padding: 0.55rem 1.1rem;
      font: inherit;
      font-weight: 700;
      background: var(--brand);
      color: #fff;
      box-shadow: 0 6px 16px rgba(12, 92, 77, 0.22);
      pointer-events: none;
    }
    .submit-btn.flash { animation: pulse 0.7s ease 2; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .actor {
      float: right;
      width: 72px;
      margin: -0.2rem 0 0.4rem 0.5rem;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
    }
    .actor.show { opacity: 1; transform: none; }
    .actor-body {
      aspect-ratio: 3/4;
      border-radius: 14px 14px 6px 6px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.5), transparent 45%),
        linear-gradient(160deg, var(--actor, var(--guide)), color-mix(in srgb, var(--actor, var(--guide)) 45%, #fff));
      border: 2px solid rgba(255,255,255,0.7);
      box-shadow: 0 10px 22px rgba(26, 36, 32, 0.16);
      display: grid;
      place-items: end center;
      padding-bottom: 0.4rem;
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 0.68rem;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.22);
    }
    .summary {
      display: none;
      width: min(560px, 100%);
      margin: 0.75rem auto 0;
      background: rgba(255,255,255,0.94);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.85rem 1rem;
      box-shadow: 0 12px 28px rgba(26, 36, 32, 0.1);
      animation: fade-up 0.35s ease both;
    }
    .summary.show { display: block; }
    .summary h2 {
      margin: 0 0 0.3rem;
      font-family: var(--font-d);
      font-size: 1.1rem;
    }
    .summary > p {
      margin: 0 0 0.7rem;
      color: var(--muted);
      font-size: 0.86rem;
    }
    .table-card {
      margin-bottom: 0.55rem;
      padding: 0.55rem 0.65rem;
      border-radius: 10px;
      background: #f4f8f6;
      border: 1px solid var(--line);
    }
    .table-card h3 {
      margin: 0 0 0.3rem;
      font-family: var(--font-ui);
      font-size: 0.9rem;
    }
    .table-card ul {
      margin: 0;
      padding-left: 1.05rem;
      font-size: 0.82rem;
      line-height: 1.45;
    }
    .table-card .origin { color: var(--muted); font-size: 0.76rem; }
    .dialog {
      z-index: 6;
      display: grid;
      grid-template-rows: auto auto auto;
      gap: 0.3rem;
      padding: 0.65rem 0.85rem 0.75rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(245,249,247,0.98));
      border-top: 1px solid var(--line);
      box-shadow: 0 -10px 28px rgba(26, 36, 32, 0.08);
      max-height: 42dvh;
      overflow: auto;
    }
    .dialog-speaker {
      margin: 0;
      font-family: var(--font-ui);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--speaker, var(--guide));
    }
    .dialog-line {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.55;
      min-height: 2.8em;
    }
    .dialog-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .progress {
      font-size: 0.72rem;
      color: var(--muted);
      font-family: var(--font-ui);
    }
    .choices {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      width: 100%;
    }
    .choice-btn, .next-btn, .cta-btn {
      border: 0;
      border-radius: 12px;
      padding: 0.65rem 0.9rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
    }
    .next-btn {
      margin-left: auto;
      background: var(--brand);
      color: #fff;
      min-width: 7.5rem;
      text-align: center;
      box-shadow: 0 6px 16px rgba(12, 92, 77, 0.25);
    }
    .next-btn:disabled { opacity: 0.55; cursor: wait; }
    .choice-btn {
      background: #fff;
      border: 1.5px solid color-mix(in srgb, var(--brand) 35%, white);
      color: var(--ink);
    }
    .choice-btn:hover {
      background: var(--soft);
      border-color: var(--brand);
    }
    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      width: 100%;
    }
    .cta-btn {
      background: var(--brand);
      color: #fff;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }
    .cta-btn.ghost {
      background: #fff;
      color: var(--brand);
      border: 1.5px solid color-mix(in srgb, var(--brand) 35%, white);
    }
    .tap-catch {
      position: absolute;
      inset: 0;
      z-index: 1;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .tap-catch[hidden] { display: none; }
    @media (max-width: 640px) {
      .form-sheet { padding: 1rem 0.85rem 1.15rem; }
      .form-title { font-size: 1.25rem; }
      .field { grid-template-columns: 4.4rem minmax(0, 1fr); }
      .dialog-line { font-size: 0.92rem; }
      .actor { width: 58px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <a class="seed" href="./index.html">SEED</a>
      <div class="brand">
        <p class="eyebrow">邊講邊填 · Show</p>
        <h1 id="title">請假系統</h1>
      </div>
      <div class="top-actions">
        <button type="button" id="btn-restart">重來</button>
        <a class="chip" href="./index.html?mode=map&system=leave">地圖</a>
      </div>
    </header>

    <div class="stage-wrap" id="stage-wrap">
      <button type="button" class="tap-catch" id="tap-catch" aria-label="下一步"></button>
      <article class="form-sheet" id="form-sheet">
        <div class="actor" id="actor" aria-hidden="true"><div class="actor-body" id="actor-body">顧問</div></div>
        <h2 class="form-title" id="form-title">請假申請單</h2>
        <p class="form-sub" id="form-sub">空白開始 · 一欄一欄填進去</p>
        <div id="sections"></div>
        <div class="submit-row" id="submit-row">
          <button type="button" class="submit-btn" id="submit-btn">送出</button>
        </div>
      </article>
      <aside class="summary" id="summary"></aside>
    </div>

    <section class="dialog" id="dialog" aria-live="polite">
      <p class="dialog-speaker" id="speaker">旁白</p>
      <p class="dialog-line" id="line">載入中…</p>
      <div class="dialog-foot" id="foot">
        <span class="progress" id="progress">—</span>
        <button type="button" class="next-btn" id="btn-next">下一步 ▸</button>
      </div>
    </section>
  </div>

  <script type="application/json" id="vn-data">
{
  "id": "leave-show",
  "title": "請假系統",
  "subtitle": "邊講邊填 · 每一欄為什麼在這裡",
  "cast": [
    {
      "id": "narrator",
      "label": "旁白",
      "tone": "soft"
    },
    {
      "id": "you",
      "label": "林小華",
      "tone": "user"
    },
    {
      "id": "guide",
      "label": "系統顧問",
      "tone": "guide"
    },
    {
      "id": "manager",
      "label": "陳主管",
      "tone": "manager"
    },
    {
      "id": "hr",
      "label": "王人事",
      "tone": "hr"
    }
  ],
  "form": {
    "title": "請假申請單",
    "sections": [
      {
        "id": "apply",
        "label": "申請內容",
        "fields": [
          {
            "id": "name",
            "label": "姓名",
            "placeholder": "尚空白"
          },
          {
            "id": "phone",
            "label": "電話",
            "placeholder": "尚空白"
          },
          {
            "id": "address",
            "label": "地址",
            "placeholder": "尚空白"
          },
          {
            "id": "last_day",
            "label": "最後一天",
            "placeholder": "尚空白"
          }
        ]
      },
      {
        "id": "manager",
        "label": "主管簽核",
        "fields": [
          {
            "id": "m_name",
            "label": "簽核人",
            "placeholder": "尚空白"
          },
          {
            "id": "m_date",
            "label": "日期",
            "placeholder": "尚空白"
          },
          {
            "id": "m_status",
            "label": "狀態",
            "placeholder": "尚空白"
          },
          {
            "id": "m_comment",
            "label": "意見",
            "placeholder": "尚空白"
          }
        ]
      },
      {
        "id": "hr",
        "label": "HR 處理",
        "fields": [
          {
            "id": "h_name",
            "label": "處理人",
            "placeholder": "尚空白"
          },
          {
            "id": "h_date",
            "label": "日期",
            "placeholder": "尚空白"
          },
          {
            "id": "h_status",
            "label": "狀態",
            "placeholder": "尚空白"
          },
          {
            "id": "h_comment",
            "label": "意見",
            "placeholder": "尚空白"
          }
        ]
      },
      {
        "id": "close",
        "label": "結案",
        "fields": [
          {
            "id": "final_status",
            "label": "結案狀態",
            "placeholder": "尚空白"
          }
        ]
      }
    ]
  },
  "start": "s01",
  "nodes": {
    "s01": {
      "speaker": "narrator",
      "line": "桌上放著一張空白的請假單。今天我們不講資料庫——我們直接填給你看。",
      "next": "s02"
    },
    "s02": {
      "speaker": "you",
      "line": "下週要請假。系統總得知道是誰請的吧？",
      "next": "s03"
    },
    "s03": {
      "speaker": "guide",
      "line": "對。所以第一欄是「姓名」——不是裝飾，是這張單的主人。我先幫你填上：林小華。",
      "focus": "name",
      "unlock": [
        "name"
      ],
      "fill": {
        "name": "林小華"
      },
      "typewriter": true,
      "next": "s04"
    },
    "s04": {
      "speaker": "guide",
      "line": "請假期間人可能不在座位。若有急事，要用電話找得到你——所以下一欄是「電話」。",
      "focus": "phone",
      "unlock": [
        "phone"
      ],
      "fill": {
        "phone": "0912-345-678"
      },
      "typewriter": true,
      "next": "s05"
    },
    "s05": {
      "speaker": "you",
      "line": "對了，休假時我可能回老家。要不要留個地址？",
      "next": "s06"
    },
    "s06": {
      "speaker": "guide",
      "line": "好主意。「地址」不是多餘欄位——是請假期間的聯絡地點。我填上你老家的地址。",
      "focus": "address",
      "unlock": [
        "address"
      ],
      "fill": {
        "address": "台南市中西區民生路一段 88 號"
      },
      "typewriter": true,
      "next": "s07"
    },
    "s07": {
      "speaker": "guide",
      "line": "還差最關鍵的：你要請到哪一天？「最後一天」決定假單的結束點，也方便排班。",
      "focus": "last_day",
      "unlock": [
        "last_day"
      ],
      "fill": {
        "last_day": "2026-08-15"
      },
      "typewriter": true,
      "next": "s08"
    },
    "s08": {
      "speaker": "guide",
      "line": "申請內容齊了。按下「送出」——單子才會離開你的手，交給主管。",
      "focus": "btn_submit",
      "showSubmit": true,
      "flashSubmit": true,
      "fill": {
        "final_status": "待一簽"
      },
      "unlock": [
        "final_status"
      ],
      "next": "s09"
    },
    "s09": {
      "speaker": "manager",
      "line": "我是陳主管。單子到我這裡了——系統要留下「是誰在簽」，不是anonymous。",
      "focus": "m_name",
      "unlockSection": "manager",
      "unlock": [
        "m_name"
      ],
      "fill": {
        "m_name": "陳主管"
      },
      "typewriter": true,
      "next": "s10"
    },
    "s10": {
      "speaker": "manager",
      "line": "「日期」記下我何時看過這張單。以後若有爭議，時間軸要對得起來。",
      "focus": "m_date",
      "unlock": [
        "m_date"
      ],
      "fill": {
        "m_date": "2026-08-09"
      },
      "typewriter": true,
      "next": "s11"
    },
    "s11": {
      "speaker": "manager",
      "line": "「狀態」是我的決定：同意，或不同意。這一行會推著流程往下走——或停住。",
      "focus": "m_status",
      "unlock": [
        "m_status"
      ],
      "next": "s12"
    },
    "s12": {
      "speaker": "guide",
      "line": "關鍵選擇來了：若主管不同意，這張單該怎麼收場？",
      "choices": [
        {
          "id": "approve",
          "label": "先看「同意」這條路（繼續給 HR）",
          "next": "b_approve"
        },
        {
          "id": "return",
          "label": "不同意 → 退回給林小華改",
          "next": "b_return"
        },
        {
          "id": "reject",
          "label": "不同意 → 直接拒絕結案",
          "next": "b_reject"
        }
      ]
    },
    "b_approve": {
      "speaker": "manager",
      "line": "我填「同意」。意見寫一句：准假，好好休息。單子往 HR 流。",
      "focus": "m_comment",
      "unlock": [
        "m_comment"
      ],
      "fill": {
        "m_status": "同意",
        "m_comment": "准假，好好休息",
        "final_status": "待二簽"
      },
      "typewriter": true,
      "next": "s13"
    },
    "b_return": {
      "speaker": "manager",
      "line": "我填「不同意」。意見：最後一天跟專案衝期，請改日期再送。狀態變「待修改」——你可以改完再送。",
      "focus": "m_comment",
      "unlock": [
        "m_comment"
      ],
      "fill": {

        "m_comment": "跟專案衝期，請改日期再送",
        "final_status": "待修改"

      "next": "s_end_early"
    },
    "b_reject": {

      "line": "我填「不同意」，並直接結案為「已拒絕」。這次不能再改——若要請假，得重開一張。",
      "focus": "m_comment",
      "unlock": [
        "m_comment"
      ],
      "fill": {
        "m_status": "不同意",
        "m_comment": "人力不足，本次不核准",
        "final_status": "已拒絕"
      },
      "typewriter": true,
      "next": "s_end_early"
    },
    "s13": {
      "speaker": "hr",
      "line": "我是王人事。主管准了之後，輪到我登錄假別——所以也要留下「處理人」是誰。",
      "focus": "h_name",
      "unlockSection": "hr",
      "unlock": [
        "h_name"
      ],
      "fill": {
        "h_name": "王人事"
      },
      "typewriter": true,
      "next": "s14"
    },
    "s14": {
      "speaker": "hr",
      "line": "日期、狀態、意見——跟主管區一樣的道理：誰、何時、結果、為什麼。我標「完成」，並結案為「已核准」。",
      "focus": "h_comment",
      "unlock": [
        "h_date",
        "h_status",
        "h_comment"
      ],
      "fill": {
        "h_date": "2026-08-10",
        "h_status": "完成",
        "h_comment": "特休已登錄",
        "final_status": "已核准"
      },
      "typewriter": true,
      "next": "s15"
    },
    "s15": {
      "speaker": "narrator",
      "line": "你剛才親手看過：每一欄都是因為「有人要做一件事」才出現的。不是先畫表，是先过日子。",
      "next": "end"
    },
    "s_end_early": {
      "speaker": "narrator",
      "line": "這條路在主管關就停了。你仍然看得到：不同意時，意見欄與結案狀態為什麼重要。",
      "next": "end"
    },
    "end": {
      "speaker": "guide",
      "line": "表單走完了。下面是這套系統收成幾張表——每一欄都能追回剛才填的那一句話。",
      "ending": true,
      "summary": true,
      "cta": [
        {
          "label": "打開地圖驗證",
          "action": "open-map",
          "system": "leave"
        },
        {
          "label": "再填一次",
          "action": "restart"
        }
      ]
    }
  },
  "tables": [
    {
      "id": "leave",
      "label": "請假主檔",
      "fields": [
        {
          "label": "姓名",
          "origin": "知道是誰請假 → 林小華"
        },
        {
          "label": "電話",
          "origin": "請假期間要聯絡得到人"
        },
        {
          "label": "地址",
          "origin": "休假時的聯絡地點"
        },
        {
          "label": "最後一天",
          "origin": "假單結束點、方便排班"
        },
        {
          "label": "結案狀態",
          "origin": "待一簽／待二簽／待修改／已核准／已拒絕"
        }
      ]
    },
    {
      "id": "sign",
      "label": "簽核歷程",
      "fields": [
        {
          "label": "關卡",
          "origin": "主管一簽、HR 二簽"
        },
        {
          "label": "簽核人",
          "origin": "留下是誰處理，不是 anonymous"
        },
        {
          "label": "日期",
          "origin": "時間軸要對得起來"
        },
        {
          "label": "狀態",
          "origin": "同意／不同意／完成——推動或停住流程"
        },
        {
          "label": "意見",
          "origin": "不同意或備註時要說清楚為什麼"
        }
      ]
    }
  ]
}
  </script>
  <script>
    const TONE = {
      soft: "#5a6e65",
      user: "#1f6fbf",
      guide: "#0c5c4d",
      manager: "#b45309",
      hr: "#6d4a9e",
    };

    const data = JSON.parse(document.getElementById("vn-data").textContent);
    const els = {
      title: document.getElementById("title"),
      formTitle: document.getElementById("form-title"),
      formSub: document.getElementById("form-sub"),
      sections: document.getElementById("sections"),
      submitRow: document.getElementById("submit-row"),
      submitBtn: document.getElementById("submit-btn"),
      speaker: document.getElementById("speaker"),
      line: document.getElementById("line"),
      foot: document.getElementById("foot"),
      tap: document.getElementById("tap-catch"),
      actor: document.getElementById("actor"),
      actorBody: document.getElementById("actor-body"),
      summary: document.getElementById("summary"),
      restart: document.getElementById("btn-restart"),
      stage: document.getElementById("stage-wrap"),
    };

    const state = {
      nodeId: data.start,
      values: {},
      unlocked: new Set(),
      openSections: new Set(["apply"]),
      stepCount: 0,
      busy: false,
      typeToken: 0,
    };

    function castOf(id) {
      return data.cast.find((c) => c.id === id) || { id, label: id, tone: "guide" };
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function fieldMeta(id) {
      for (const sec of data.form.sections) {
        const f = sec.fields.find((x) => x.id === id);
        if (f) return { ...f, sectionId: sec.id };
      }
      return null;
    }

    function buildForm() {
      els.formTitle.textContent = data.form.title;
      els.sections.innerHTML = data.form.sections
        .map(
          (sec) => `<section class="section" data-section="${sec.id}" id="sec-${sec.id}">
            <p class="section-label">${escapeHtml(sec.label)}</p>
            <div class="fields">
              ${sec.fields
                .map(
                  (f) => `<div class="field" data-field="${f.id}" id="field-${f.id}">
                    <div class="field-label">${escapeHtml(f.label)}</div>
                    <div class="field-value empty" data-value="${f.id}">${escapeHtml(f.placeholder || "尚空白")}</div>
                  </div>`
                )
                .join("")}
            </div>
          </section>`
        )
        .join("");
    }

    function paintForm() {
      data.form.sections.forEach((sec) => {
        const secEl = document.getElementById(`sec-${sec.id}`);
        const anyOpen = sec.fields.some((f) => state.unlocked.has(f.id)) || state.openSections.has(sec.id);
        // section opens when unlocked or explicitly opened; apply starts open but empty fields hidden
        const showSec =
          state.openSections.has(sec.id) ||
          sec.fields.some((f) => state.unlocked.has(f.id));
        secEl.classList.toggle("open", showSec);
        sec.fields.forEach((f) => {
          const el = document.getElementById(`field-${f.id}`);
          const valEl = el.querySelector("[data-value]");
          const unlocked = state.unlocked.has(f.id);
          el.classList.toggle("open", unlocked);
          const val = state.values[f.id];
          if (val == null || val === "") {
            valEl.textContent = f.placeholder || "尚空白";
            valEl.classList.add("empty");
          } else if (!valEl.classList.contains("typing")) {
            valEl.textContent = val;
            valEl.classList.remove("empty");
          }
        });
      });
    }

    function setFocus(fieldId) {
      document.querySelectorAll(".field").forEach((el) => el.classList.remove("focus"));
      if (!fieldId || fieldId === "btn_submit") return;
      const el = document.getElementById(`field-${fieldId}`);
      if (el) {
        el.classList.add("focus");
        el.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
    }

    function setActor(speakerId) {
      const c = castOf(speakerId);
      const color = TONE[c.tone] || TONE.guide;
      els.actor.style.setProperty("--actor", color);
      els.actorBody.textContent = c.label;
      els.actor.classList.toggle("show", c.id !== "narrator");
    }

    function sleep(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    async function typeValue(fieldId, text) {
      const el = document.getElementById(`field-${fieldId}`);
      const valEl = el?.querySelector("[data-value]");
      if (!valEl) {
        state.values[fieldId] = text;
        return;
      }
      state.unlocked.add(fieldId);
      paintForm();
      setFocus(fieldId);
      const token = ++state.typeToken;
      valEl.classList.remove("empty");
      valEl.classList.add("typing");
      valEl.textContent = "";
      for (let i = 1; i <= text.length; i++) {
        if (token !== state.typeToken) return;
        valEl.textContent = text.slice(0, i);
        await sleep(text.length > 18 ? 28 : 42);
      }
      if (token !== state.typeToken) return;
      valEl.classList.remove("typing");
      state.values[fieldId] = text;
    }

    async function applyFills(node) {
      if (node.unlockSection) state.openSections.add(node.unlockSection);
      (node.unlock || []).forEach((id) => state.unlocked.add(id));
      if (node.showSubmit) els.submitRow.classList.add("open");
      paintForm();

      if (node.focus) setFocus(node.focus);
      if (node.flashSubmit) {
        els.submitBtn.classList.remove("flash");
        void els.submitBtn.offsetWidth;
        els.submitBtn.classList.add("flash");
      }

      const fills = node.fill || {};
      const keys = Object.keys(fills);
      if (!keys.length) return;

      if (node.typewriter) {
        for (const key of keys) {
          state.unlocked.add(key);
          paintForm();
          await typeValue(key, String(fills[key]));
          await sleep(120);
        }
      } else {
        for (const key of keys) {
          state.unlocked.add(key);
          state.values[key] = String(fills[key]);
        }
        paintForm();
        if (node.focus && fills[node.focus] != null) setFocus(node.focus);
      }
    }

    function renderSummary() {
      els.summary.classList.add("show");
      els.summary.innerHTML = `
        <h2>這個系統收成 ${data.tables.length} 張表</h2>
        <p>每一欄都能追回剛才填表時說的那句話：</p>
        ${data.tables
          .map(
            (t) => `<div class="table-card">
              <h3>${escapeHtml(t.label)}</h3>
              <ul>${t.fields
                .map(
                  (f) =>
                    `<li><strong>${escapeHtml(f.label)}</strong> <span class="origin">— ${escapeHtml(f.origin)}</span></li>`
                )
                .join("")}</ul>
            </div>`
          )
          .join("")}`;
      els.summary.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    function clearSummary() {
      els.summary.classList.remove("show");
      els.summary.innerHTML = "";
    }

    function setBusy(busy) {
      state.busy = busy;
      const next = els.foot.querySelector(".next-btn");
      if (next) next.disabled = busy;
    }

    async function renderNode() {
      const node = data.nodes[state.nodeId];
      if (!node) return;

      const cast = castOf(node.speaker);
      const color = TONE[cast.tone] || TONE.guide;
      els.speaker.textContent = cast.label;
      els.speaker.style.setProperty("--speaker", color);
      els.line.textContent = node.line;
      setActor(node.speaker);

      if (node.summary) renderSummary();
      else clearSummary();

      const filled = Object.keys(state.values).length;
      const progressText = `第 ${state.stepCount + 1} 幕 · 已填 ${filled} 欄`;

      setBusy(true);
      await applyFills(node);
      setBusy(false);

      if (node.choices?.length) {
        els.tap.hidden = true;
        els.foot.innerHTML = `<span class="progress">${progressText}</span>
          <div class="choices">
            ${node.choices
              .map(
                (c) =>
                  `<button type="button" class="choice-btn" data-next="${escapeHtml(c.next)}">${escapeHtml(c.label)}</button>`
              )
              .join("")}
          </div>`;
        els.foot.querySelectorAll(".choice-btn").forEach((btn) => {
          btn.addEventListener("click", () => go(btn.getAttribute("data-next")));
        });
      } else if (node.ending && node.cta?.length) {
        els.tap.hidden = true;
        els.foot.innerHTML = `<span class="progress">結局</span>
          <div class="cta-row">
            ${node.cta
              .map((c) => {
                if (c.action === "open-map") {
                  return `<a class="cta-btn" href="./index.html?mode=map&system=leave">${escapeHtml(c.label)}</a>`;
                }
                return `<button type="button" class="cta-btn ghost" data-action="${escapeHtml(c.action)}">${escapeHtml(c.label)}</button>`;
              })
              .join("")}
          </div>`;
        els.foot.querySelectorAll("[data-action=restart]").forEach((btn) => {
          btn.addEventListener("click", restart);
        });
      } else {
        els.tap.hidden = false;
        els.foot.innerHTML = `<span class="progress">${progressText}</span>
          <button type="button" class="next-btn" id="btn-next">下一步 ▸</button>`;
        document.getElementById("btn-next")?.addEventListener("click", advance);
      }
    }

    function go(nextId) {
      if (state.busy || !nextId || !data.nodes[nextId]) return;
      state.nodeId = nextId;
      state.stepCount += 1;
      renderNode();
    }

    function advance() {
      if (state.busy) return;
      const node = data.nodes[state.nodeId];
      if (!node || node.choices?.length || node.ending) return;
      if (node.next) go(node.next);
    }

    function restart() {
      state.typeToken += 1;
      state.nodeId = data.start;
      state.values = {};
      state.unlocked = new Set();
      state.openSections = new Set(["apply"]);
      state.stepCount = 0;
      state.busy = false;
      els.submitRow.classList.remove("open");
      els.submitBtn.classList.remove("flash");
      clearSummary();
      paintForm();
      setFocus(null);
      renderNode();
    }

    els.title.textContent = data.title;
    buildForm();
    // apply section visible from start (empty invitation)
    document.getElementById("sec-apply")?.classList.add("open");
    paintForm();
    renderNode();

    els.tap.addEventListener("click", advance);
    els.restart.addEventListener("click", restart);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " " || e.key === "ArrowRight") {
        const node = data.nodes[state.nodeId];
        if (!node?.choices && !node?.ending && !state.busy) {
          e.preventDefault();
          advance();
        }
      }
    });
  </script>
</body>
