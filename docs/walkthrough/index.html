<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>統一表單系統 — SEED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
:root {
  --ink: #1a2420;
  --muted: #5a6e65;
  --line: rgba(26, 36, 32, 0.12);
  --brand: #0c5c4d;
  --brand-2: #178f72;
  --paper: #fffcf7;
  --paper-edge: #e8e0d2;
  --soft: #d9efe7;
  --user: #1f6fbf;
  --guide: #0c5c4d;
  --manager: #b45309;
  --hr: #6d4a9e;
  --danger: #b42318;
  --font-d: "Fraunces", "Noto Sans TC", serif;
  --font-b: "Noto Sans TC", sans-serif;
  --font-ui: "Outfit", "Noto Sans TC", sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%;
  font-family: var(--font-b);
  color: var(--ink);
  background: #cfdcd5;
  overflow: hidden;
}
.app {
  height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr;
}
.app[data-mode="show"] { grid-template-rows: auto 1fr minmax(150px, auto); }
.top {
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.5rem 0.85rem;
  background: rgba(247, 250, 248, 0.94);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
  flex-wrap: wrap;
}
.top a.seed {
  text-decoration: none;
  color: var(--brand);
  font-family: var(--font-ui);
  font-weight: 700;
  font-size: 0.9rem;
  padding: 0.3rem 0.55rem;
  border-radius: 999px;
  background: var(--soft);
}
.brand { min-width: 0; flex: 1; }
.brand .eyebrow {
  margin: 0;
  font-family: var(--font-ui);
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--brand);
  font-weight: 600;
}
.brand h1 {
  margin: 0;
  font-family: var(--font-d);
  font-size: 1.15rem;
  letter-spacing: -0.02em;
  line-height: 1.15;
}
.mode-tabs, .sys-tabs {
  display: flex;
  gap: 0.3rem;
  flex-wrap: wrap;
}
.mode-tab, .sys-tab, .role-tab, .ghost-btn, .primary-btn {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 999px;
  padding: 0.3rem 0.75rem;
  font: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}
.mode-tab.active, .sys-tab.active, .role-tab.active {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}
.primary-btn {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
  border-radius: 12px;
  padding: 0.55rem 0.95rem;
}
.primary-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.ghost-btn { border-radius: 12px; padding: 0.55rem 0.95rem; }
.stage-wrap {
  position: relative;
  min-height: 0;
  overflow: auto;
  padding: 0.85rem;
  background:
    radial-gradient(800px 360px at 12% 0%, rgba(23, 143, 114, 0.16), transparent 55%),
    linear-gradient(165deg, #e4efe9, #d2e0d8 55%, #c5d6cc);
}
.form-sheet {
  width: min(560px, 100%);
  margin: 0 auto;
  background: linear-gradient(180deg, #fffefb 0%, var(--paper) 100%);
  border: 1px solid var(--paper-edge);
  border-radius: 4px;
  box-shadow: 0 18px 40px rgba(26, 36, 32, 0.14);
  padding: 1.15rem 1.2rem 1.35rem;
  position: relative;
  animation: sheet-in 0.45s ease both;
}
@keyframes sheet-in {
  from { opacity: 0; transform: translateY(10px) scale(0.985); }
  to { opacity: 1; transform: none; }
}
.form-sheet::before {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 5px;
  background: linear-gradient(90deg, var(--brand), var(--brand-2));
  border-radius: 4px 4px 0 0;
}
.form-title {
  margin: 0.15rem 0 0.15rem;
  font-family: var(--font-d);
  font-size: 1.4rem;
  text-align: center;
}
.form-sub {
  margin: 0 0 0.85rem;
  text-align: center;
  font-size: 0.78rem;
  color: var(--muted);
}
.status-pill {
  display: inline-flex;
  margin: 0 auto 0.85rem;
  padding: 0.25rem 0.7rem;
  border-radius: 999px;
  background: var(--soft);
  color: var(--brand);
  font-size: 0.78rem;
  font-weight: 700;
  font-family: var(--font-ui);
}
.status-wrap { text-align: center; }
.section {
  display: none;
  margin-bottom: 0.95rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px dashed rgba(26, 36, 32, 0.12);
}
.section.open { display: block; animation: fade-up 0.3s ease both; }
.section-label {
  margin: 0 0 0.5rem;
  font-family: var(--font-ui);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--brand);
}
.fields { display: grid; gap: 0.45rem; }
.field {
  display: none;
  grid-template-columns: 5.2rem minmax(0, 1fr);
  gap: 0.45rem;
  align-items: start;
  padding: 0.4rem 0.5rem;
  border-radius: 10px;
  border: 1.5px solid transparent;
}
.field.open { display: grid; animation: fade-up 0.3s ease both; }
.field.focus {
  border-color: color-mix(in srgb, var(--brand) 55%, white);
  background: rgba(12, 92, 77, 0.06);
  box-shadow: 0 0 0 3px rgba(12, 92, 77, 0.08);
}
.field-label {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--muted);
  padding-top: 0.45rem;
}
.field.focus .field-label { color: var(--brand); }
.field-value, .field-input {
  min-height: 1.7rem;
  padding: 0.4rem 0.55rem;
  border-radius: 8px;
  border: 1px solid rgba(26, 36, 32, 0.12);
  background: #fff;
  font-size: 0.95rem;
  line-height: 1.35;
  font: inherit;
  width: 100%;
  color: var(--ink);
}
.field-value.empty {
  color: #a8b5af;
  font-style: italic;
  font-size: 0.85rem;
}
.field-value.typing::after {
  content: "▌";
  margin-left: 1px;
  animation: blink 0.8s step-end infinite;
  color: var(--brand);
}
.field-input:disabled, .field-input[readonly] {
  background: #f3f6f4;
  color: var(--muted);
}
.field-hint {
  grid-column: 2;
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: -0.15rem;
}
textarea.field-input { min-height: 4rem; resize: vertical; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes fade-up {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}
.submit-row, .action-row {
  display: none;
  flex-wrap: wrap;
  gap: 0.4rem;
  justify-content: flex-end;
  margin-top: 0.5rem;
}
.submit-row.open, .action-row.open { display: flex; }
.submit-btn {
  border: 0;
  border-radius: 10px;
  padding: 0.55rem 1.1rem;
  font: inherit;
  font-weight: 700;
  background: var(--brand);
  color: #fff;
  pointer-events: none;
}
.submit-btn.flash { animation: pulse 0.7s ease 2; }
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}
.actor {
  float: right;
  width: 72px;
  margin: -0.2rem 0 0.4rem 0.5rem;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
}
.actor.show { opacity: 1; transform: none; }
.actor-body {
  aspect-ratio: 3/4;
  border-radius: 14px 14px 6px 6px;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.5), transparent 45%),
    linear-gradient(160deg, var(--actor, var(--guide)), color-mix(in srgb, var(--actor, var(--guide)) 45%, #fff));
  border: 2px solid rgba(255,255,255,0.7);
  box-shadow: 0 10px 22px rgba(26, 36, 32, 0.16);
  display: grid;
  place-items: end center;
  padding-bottom: 0.4rem;
  font-family: var(--font-ui);
  font-weight: 700;
  font-size: 0.68rem;
  color: #fff;
}
.summary {
  display: none;
  width: min(560px, 100%);
  margin: 0.75rem auto 0;
  background: rgba(255,255,255,0.94);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 0.85rem 1rem;
}
.summary.show { display: block; animation: fade-up 0.35s ease both; }
.summary h2 { margin: 0 0 0.3rem; font-family: var(--font-d); font-size: 1.1rem; }
.summary > p { margin: 0 0 0.7rem; color: var(--muted); font-size: 0.86rem; }
.table-card {
  margin-bottom: 0.55rem;
  padding: 0.55rem 0.65rem;
  border-radius: 10px;
  background: #f4f8f6;
  border: 1px solid var(--line);
}
.table-card h3 { margin: 0 0 0.3rem; font-family: var(--font-ui); font-size: 0.9rem; }
.table-card ul { margin: 0; padding-left: 1.05rem; font-size: 0.82rem; line-height: 1.45; }
.table-card .origin { color: var(--muted); font-size: 0.76rem; }
.dialog {
  z-index: 6;
  display: none;
  grid-template-rows: auto auto auto;
  gap: 0.3rem;
  padding: 0.65rem 0.85rem 0.75rem;
  background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(245,249,247,0.98));
  border-top: 1px solid var(--line);
  box-shadow: 0 -10px 28px rgba(26, 36, 32, 0.08);
  max-height: 42dvh;
  overflow: auto;
}
.app[data-mode="show"] .dialog { display: grid; }
.dialog-speaker {
  margin: 0;
  font-family: var(--font-ui);
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--speaker, var(--guide));
}
.dialog-line { margin: 0; font-size: 0.98rem; line-height: 1.55; min-height: 2.8em; }
.dialog-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.progress { font-size: 0.72rem; color: var(--muted); font-family: var(--font-ui); }
.choices { display: flex; flex-direction: column; gap: 0.4rem; width: 100%; }
.choice-btn, .next-btn, .cta-btn {
  border: 0;
  border-radius: 12px;
  padding: 0.65rem 0.9rem;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  text-align: left;
}
.next-btn {
  margin-left: auto;
  background: var(--brand);
  color: #fff;
  min-width: 7.5rem;
  text-align: center;
}
.next-btn:disabled { opacity: 0.55; cursor: wait; }
.choice-btn {
  background: #fff;
  border: 1.5px solid color-mix(in srgb, var(--brand) 35%, white);
}
.choice-btn:hover { background: var(--soft); border-color: var(--brand); }
.cta-row { display: flex; flex-wrap: wrap; gap: 0.4rem; width: 100%; }
.cta-btn {
  background: var(--brand);
  color: #fff;
  text-align: center;
  text-decoration: none;
  display: inline-block;
}
.cta-btn.ghost {
  background: #fff;
  color: var(--brand);
  border: 1.5px solid color-mix(in srgb, var(--brand) 35%, white);
}
.tap-catch {
  position: absolute;
  inset: 0;
  z-index: 1;
  border: 0;
  background: transparent;
  cursor: pointer;
}
.tap-catch[hidden] { display: none; }
.form-toolbar {
  display: none;
  width: min(560px, 100%);
  margin: 0 auto 0.65rem;
  gap: 0.45rem;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
}
.app[data-mode="form"] .form-toolbar { display: flex; }
.app[data-mode="form"] .actor { display: none; }
.toast {
  position: fixed;
  left: 50%;
  bottom: 1.2rem;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: #fff;
  padding: 0.65rem 1rem;
  border-radius: 12px;
  font-size: 0.88rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  z-index: 20;
  max-width: min(90vw, 420px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.form-note {
  width: min(560px, 100%);
  margin: 0.65rem auto 0;
  font-size: 0.8rem;
  color: var(--muted);
  text-align: center;
}
@media (max-width: 640px) {
  .form-sheet { padding: 1rem 0.85rem 1.15rem; }
  .form-title { font-size: 1.25rem; }
  .field { grid-template-columns: 4.4rem minmax(0, 1fr); }
  .dialog-line { font-size: 0.92rem; }
  .actor { width: 58px; }
}

  </style>
</head>
<body>
  <div class="app" id="app" data-mode="show">
    <header class="top">
      <a class="seed" href="../index.html">SEED</a>
      <div class="brand">
        <p class="eyebrow" id="eyebrow">邊講邊填 · Show</p>
        <h1 id="title">請假系統</h1>
      </div>
      <div class="mode-tabs" role="tablist" aria-label="模式">
        <button type="button" class="mode-tab active" data-mode="show">Show</button>
        <button type="button" class="mode-tab" data-mode="form">表單</button>
        <a class="mode-tab" href="./map.html?system=leave">地圖</a>
      </div>
      <button type="button" class="ghost-btn" id="btn-restart" style="border-radius:999px;padding:0.3rem 0.75rem">重來</button>
    </header>

    <div class="stage-wrap" id="stage-wrap">
      <button type="button" class="tap-catch" id="tap-catch" aria-label="下一步"></button>
      <div class="form-toolbar" id="form-toolbar">
        <div class="mode-tabs" id="role-tabs" aria-label="角色"></div>
        <span class="progress">資料存在此瀏覽器（localStorage）</span>
      </div>
      <article class="form-sheet" id="form-sheet">
        <div class="actor" id="actor" aria-hidden="true"><div class="actor-body" id="actor-body">顧問</div></div>
        <h2 class="form-title" id="form-title">請假申請單</h2>
        <p class="form-sub" id="form-sub">空白開始 · 一欄一欄填進去</p>
        <div class="status-wrap"><span class="status-pill" id="status-pill">草稿</span></div>
        <div id="sections"></div>
        <div class="submit-row" id="submit-row">
          <button type="button" class="submit-btn" id="submit-btn">送出</button>
        </div>
        <div class="action-row" id="action-row"></div>
      </article>
      <aside class="summary" id="summary"></aside>
      <p class="form-note">任意系統只要換成同一份 JSON（form + show 腳本 + actions），就能邊講邊填、也能真的辦單。</p>
    </div>

    <section class="dialog" id="dialog" aria-live="polite">
      <p class="dialog-speaker" id="speaker">旁白</p>
      <p class="dialog-line" id="line">載入中…</p>
      <div class="dialog-foot" id="foot">
        <span class="progress">—</span>
        <button type="button" class="next-btn">下一步 ▸</button>
      </div>
    </section>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script type="application/json" id="vn-data">
{
  "id": "leave",
  "title": "請假系統",
  "subtitle": "邊講邊填 · 同一份資料也能自己辦單",
  "cast": [
    { "id": "narrator", "label": "旁白", "tone": "soft" },
    { "id": "you", "label": "林小華", "tone": "user" },
    { "id": "guide", "label": "系統顧問", "tone": "guide" },
    { "id": "manager", "label": "陳主管", "tone": "manager" },
    { "id": "hr", "label": "王人事", "tone": "hr" }
  ],
  "roles": [
    { "id": "applicant", "label": "申請人", "persona": "林小華" },
    { "id": "manager", "label": "主管", "persona": "陳主管" },
    { "id": "hr", "label": "HR", "persona": "王人事" }
  ],
  "form": {
    "title": "請假申請單",
    "statusField": "final_status",
    "sections": [
      {
        "id": "apply",
        "label": "申請內容",
        "fields": [
          {
            "id": "name",
            "label": "姓名",
            "type": "text",
            "placeholder": "請輸入姓名",
            "required": true,
            "write": ["applicant"],
            "meaning": "這張單的主人"
          },
          {
            "id": "phone",
            "label": "電話",
            "type": "tel",
            "placeholder": "請假期間聯絡電話",
            "required": true,
            "write": ["applicant"],
            "meaning": "請假期間找得到人"
          },
          {
            "id": "address",
            "label": "地址",
            "type": "text",
            "placeholder": "休假時的聯絡地址",
            "required": false,
            "write": ["applicant"],
            "meaning": "休假時的聯絡地點"
          },
          {
            "id": "last_day",
            "label": "最後一天",
            "type": "date",
            "placeholder": "請假結束日",
            "required": true,
            "write": ["applicant"],
            "meaning": "假單結束點、方便排班"
          }
        ]
      },
      {
        "id": "manager",
        "label": "主管簽核",
        "fields": [
          {
            "id": "m_name",
            "label": "簽核人",
            "type": "text",
            "placeholder": "主管姓名",
            "write": ["manager"],
            "autoPersona": true,
            "meaning": "留下是誰在簽"
          },
          {
            "id": "m_date",
            "label": "日期",
            "type": "date",
            "write": ["manager"],
            "autoToday": true,
            "meaning": "何時看過這張單"
          },
          {
            "id": "m_status",
            "label": "狀態",
            "type": "select",
            "options": ["同意", "不同意"],
            "write": ["manager"],
            "meaning": "推動或停住流程"
          },
          {
            "id": "m_comment",
            "label": "意見",
            "type": "textarea",
            "placeholder": "同意或不同意的原因",
            "write": ["manager"],
            "meaning": "為什麼這樣決定"
          }
        ]
      },
      {
        "id": "hr",
        "label": "HR 處理",
        "fields": [
          {
            "id": "h_name",
            "label": "處理人",
            "type": "text",
            "write": ["hr"],
            "autoPersona": true,
            "meaning": "誰登錄假別"
          },
          {
            "id": "h_date",
            "label": "日期",
            "type": "date",
            "write": ["hr"],
            "autoToday": true,
            "meaning": "何時處理"
          },
          {
            "id": "h_status",
            "label": "狀態",
            "type": "select",
            "options": ["完成", "補件"],
            "write": ["hr"],
            "meaning": "HR 處理結果"
          },
          {
            "id": "h_comment",
            "label": "意見",
            "type": "textarea",
            "placeholder": "備註",
            "write": ["hr"],
            "meaning": "假別或補件說明"
          }
        ]
      },
      {
        "id": "close",
        "label": "結案",
        "fields": [
          {
            "id": "final_status",
            "label": "結案狀態",
            "type": "text",
            "write": [],
            "meaning": "整張單目前走到哪"
          }
        ]
      }
    ]
  },
  "actions": [
    {
      "id": "submit",
      "label": "送出給主管",
      "role": "applicant",
      "whenStatus": ["", "草稿", "待修改"],
      "require": ["name", "phone", "last_day"],
      "set": { "final_status": "待一簽" },
      "message": "已送出。輪到主管簽核。"
    },
    {
      "id": "approve",
      "label": "同意，送 HR",
      "role": "manager",
      "whenStatus": ["待一簽"],
      "require": ["m_comment"],
      "set": {
        "m_status": "同意",
        "final_status": "待二簽"
      },
      "autoPersona": ["m_name"],
      "autoToday": ["m_date"],
      "message": "已同意。輪到 HR 處理。"
    },
    {
      "id": "return",
      "label": "不同意，退回修改",
      "role": "manager",
      "whenStatus": ["待一簽"],
      "require": ["m_comment"],
      "set": {
        "m_status": "不同意",
        "final_status": "待修改"
      },
      "autoPersona": ["m_name"],
      "autoToday": ["m_date"],
      "message": "已退回。申請人可修改後再送。"
    },
    {
      "id": "reject",
      "label": "不同意，直接拒絕",
      "role": "manager",
      "whenStatus": ["待一簽"],
      "require": ["m_comment"],

  <script>
const TONE = {
  soft: "#5a6e65",
  user: "#1f6fbf",
  guide: "#0c5c4d",
  manager: "#b45309",
  hr: "#6d4a9e",
};

const data = JSON.parse(document.getElementById("vn-data").textContent);

const els = {
  app: document.getElementById("app"),
  title: document.getElementById("title"),
  eyebrow: document.getElementById("eyebrow"),
  formTitle: document.getElementById("form-title"),
  formSub: document.getElementById("form-sub"),
  sections: document.getElementById("sections"),
  submitRow: document.getElementById("submit-row"),
  submitBtn: document.getElementById("submit-btn"),
  actionRow: document.getElementById("action-row"),
  statusPill: document.getElementById("status-pill"),
  speaker: document.getElementById("speaker"),
  line: document.getElementById("line"),
  foot: document.getElementById("foot"),
  tap: document.getElementById("tap-catch"),
  actor: document.getElementById("actor"),
  actorBody: document.getElementById("actor-body"),
  summary: document.getElementById("summary"),
  toast: document.getElementById("toast"),
  roleTabs: document.getElementById("role-tabs"),
  formToolbar: document.getElementById("form-toolbar"),
};

const state = {
  mode: "show", // show | form
  nodeId: data.start,
  values: {},
  unlocked: new Set(),
  openSections: new Set(["apply"]),
  stepCount: 0,
  busy: false,
  typeToken: 0,
  roleId: data.roles?.[0]?.id || "applicant",
};

function storageKey() {
  return `seed-form:${data.id || "system"}`;
}

function castOf(id) {
  return data.cast.find((c) => c.id === id) || { id, label: id, tone: "guide" };
}

function roleOf(id) {
  return data.roles.find((r) => r.id === id);
}

function escapeHtml(s) {
  return String(s)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function today() {
  return new Date().toISOString().slice(0, 10);
}

function allFields() {
  return data.form.sections.flatMap((s) => s.fields.map((f) => ({ ...f, sectionId: s.id })));
}

function fieldById(id) {
  return allFields().find((f) => f.id === id);
}

function status() {
  return state.values[data.form.statusField] || "草稿";
}

function toast(msg) {
  els.toast.textContent = msg;
  els.toast.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => els.toast.classList.remove("show"), 2400);
}

function canWrite(field, roleId) {
  const w = field.write || [];
  return w.includes(roleId);
}

function buildShowForm() {
  els.formTitle.textContent = data.form.title;
  els.sections.innerHTML = data.form.sections
    .map(
      (sec) => `<section class="section" data-section="${sec.id}" id="sec-${sec.id}">
        <p class="section-label">${escapeHtml(sec.label)}</p>
        <div class="fields">
          ${sec.fields
            .map(
              (f) => `<div class="field" data-field="${f.id}" id="field-${f.id}">
                <div class="field-label">${escapeHtml(f.label)}</div>
                <div class="field-value empty" data-value="${f.id}">尚空白</div>
              </div>`
            )
            .join("")}
        </div>
      </section>`
    )
    .join("");
}

function paintShowForm() {
  data.form.sections.forEach((sec) => {
    const secEl = document.getElementById(`sec-${sec.id}`);
    const showSec =
      state.openSections.has(sec.id) ||
      sec.fields.some((f) => state.unlocked.has(f.id));
    secEl.classList.toggle("open", showSec);
    sec.fields.forEach((f) => {
      const el = document.getElementById(`field-${f.id}`);
      const valEl = el.querySelector("[data-value]");
      el.classList.toggle("open", state.unlocked.has(f.id));
      const val = state.values[f.id];
      if (val == null || val === "") {
        if (!valEl.classList.contains("typing")) {
          valEl.textContent = "尚空白";
          valEl.classList.add("empty");
        }
      } else if (!valEl.classList.contains("typing")) {
        valEl.textContent = val;
        valEl.classList.remove("empty");
      }
    });
  });
  if (els.statusPill) {
    els.statusPill.textContent = status();
  }
}

function setFocus(fieldId) {
  document.querySelectorAll(".field").forEach((el) => el.classList.remove("focus"));
  if (!fieldId || fieldId === "btn_submit") return;
  const el = document.getElementById(`field-${fieldId}`);
  if (el) {
    el.classList.add("focus");
    el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}

function setActor(speakerId) {
  const c = castOf(speakerId);
  els.actor.style.setProperty("--actor", TONE[c.tone] || TONE.guide);
  els.actorBody.textContent = c.label;
  els.actor.classList.toggle("show", c.id !== "narrator");
}

function sleep(ms) {
  return new Promise((r) => setTimeout(r, ms));
}

async function typeValue(fieldId, text) {
  const el = document.getElementById(`field-${fieldId}`);
  const valEl = el?.querySelector("[data-value]");
  if (!valEl) {
    state.values[fieldId] = text;
    return;
  }
  state.unlocked.add(fieldId);
  paintShowForm();
  setFocus(fieldId);
  const token = ++state.typeToken;
  valEl.classList.remove("empty");
  valEl.classList.add("typing");
  valEl.textContent = "";
  for (let i = 1; i <= text.length; i++) {
    if (token !== state.typeToken) return;
    valEl.textContent = text.slice(0, i);
    await sleep(text.length > 18 ? 28 : 42);
  }
  if (token !== state.typeToken) return;
  valEl.classList.remove("typing");
  state.values[fieldId] = text;
}

async function applyFills(node) {
  if (node.unlockSection) state.openSections.add(node.unlockSection);
  (node.unlock || []).forEach((id) => state.unlocked.add(id));
  if (node.showSubmit) els.submitRow.classList.add("open");
  paintShowForm();
  if (node.focus) setFocus(node.focus);
  if (node.flashSubmit) {
    els.submitBtn.classList.remove("flash");
    void els.submitBtn.offsetWidth;
    els.submitBtn.classList.add("flash");
  }
  const fills = node.fill || {};
  const keys = Object.keys(fills);
  if (!keys.length) return;
  if (node.typewriter) {
    for (const key of keys) {
      state.unlocked.add(key);
      paintShowForm();
      await typeValue(key, String(fills[key]));
      await sleep(100);
    }
  } else {
    for (const key of keys) {
      state.unlocked.add(key);
      state.values[key] = String(fills[key]);
    }
    paintShowForm();
  }
}

function renderSummary() {
  els.summary.classList.add("show");
  els.summary.innerHTML = `
    <h2>這個系統收成 ${data.tables.length} 張表</h2>
    <p>每一欄都能追回剛才填表時說的那句話：</p>
    ${data.tables
      .map(
        (t) => `<div class="table-card">
          <h3>${escapeHtml(t.label)}</h3>
          <ul>${t.fields
            .map(
              (f) =>
                `<li><strong>${escapeHtml(f.label)}</strong> <span class="origin">— ${escapeHtml(f.origin)}</span></li>`
            )
            .join("")}</ul>
        </div>`
      )
      .join("")}`;
}

function clearSummary() {
  els.summary.classList.remove("show");
  els.summary.innerHTML = "";
}

function setBusy(busy) {
  state.busy = busy;
  const next = els.foot.querySelector(".next-btn");
  if (next) next.disabled = busy;
}

async function renderNode() {
  const node = data.nodes[state.nodeId];
  if (!node) return;
  const cast = castOf(node.speaker);
  els.speaker.textContent = cast.label;
  els.speaker.style.setProperty("--speaker", TONE[cast.tone] || TONE.guide);
  els.line.textContent = node.line;
  setActor(node.speaker);
  if (node.summary) renderSummary();
  else clearSummary();

  const progressText = `第 ${state.stepCount + 1} 幕 · 已填 ${Object.keys(state.values).length} 欄`;
  setBusy(true);
  await applyFills(node);
  setBusy(false);

  if (node.choices?.length) {
    els.tap.hidden = true;
    els.foot.innerHTML = `<span class="progress">${progressText}</span>
      <div class="choices">
        ${node.choices
          .map(
            (c) =>
              `<button type="button" class="choice-btn" data-next="${escapeHtml(c.next)}">${escapeHtml(c.label)}</button>`
          )
          .join("")}
      </div>`;
    els.foot.querySelectorAll(".choice-btn").forEach((btn) => {
      btn.addEventListener("click", () => go(btn.getAttribute("data-next")));
    });
  } else if (node.ending && node.cta?.length) {
    els.tap.hidden = true;
    els.foot.innerHTML = `<span class="progress">結局</span>
      <div class="cta-row">
        ${node.cta
          .map((c) => {
            if (c.action === "open-form") {
              return `<button type="button" class="cta-btn" data-action="open-form">${escapeHtml(c.label)}</button>`;
            }
            if (c.action === "open-map") {
              return `<a class="cta-btn ghost" href="./map.html?system=leave">${escapeHtml(c.label)}</a>`;
            }
            return `<button type="button" class="cta-btn ghost" data-action="${escapeHtml(c.action)}">${escapeHtml(c.label)}</button>`;
          })
          .join("")}
      </div>`;
    els.foot.querySelectorAll("[data-action=restart]").forEach((b) => b.addEventListener("click", restartShow));
    els.foot.querySelectorAll("[data-action=open-form]").forEach((b) =>
      b.addEventListener("click", () => setMode("form"))
    );
  } else {
    els.tap.hidden = false;
    els.foot.innerHTML = `<span class="progress">${progressText}</span>
      <button type="button" class="next-btn">下一步 ▸</button>`;
    els.foot.querySelector(".next-btn")?.addEventListener("click", advance);
  }
}

function go(nextId) {
  if (state.busy || !nextId || !data.nodes[nextId]) return;
  state.nodeId = nextId;
  state.stepCount += 1;
  renderNode();
}

function advance() {
  if (state.busy) return;
  const node = data.nodes[state.nodeId];
  if (!node || node.choices?.length || node.ending) return;
  if (node.next) go(node.next);
}

function restartShow() {
  state.typeToken += 1;
  state.nodeId = data.start;
  state.values = {};
  state.unlocked = new Set();
  state.openSections = new Set(["apply"]);
  state.stepCount = 0;
  state.busy = false;
  els.submitRow.classList.remove("open");
  els.submitBtn.classList.remove("flash");
  clearSummary();
  paintShowForm();
  setFocus(null);
  renderNode();
}

/* ——— Real form ——— */

function loadDoc() {
  try {
    const raw = localStorage.getItem(storageKey());
    if (raw) return JSON.parse(raw);
  } catch (_) {}
  return { values: { final_status: "草稿" }, updatedAt: null };
}

function saveDoc(doc) {
  localStorage.setItem(storageKey(), JSON.stringify(doc));
}

function buildRealForm() {
  const doc = loadDoc();
  state.values = { ...doc.values };
  if (!state.values.final_status) state.values.final_status = "草稿";

  els.formTitle.textContent = data.form.title;
  els.formSub.textContent = "同一份系統定義 · 可切角色真的辦單";
  els.sections.innerHTML = data.form.sections
    .map(
      (sec) => `<section class="section open" data-section="${sec.id}">
        <p class="section-label">${escapeHtml(sec.label)}</p>
        <div class="fields">
          ${sec.fields
            .map((f) => {
              const writable = canWrite(f, state.roleId);
              const val = state.values[f.id] ?? "";
              const meaning = f.meaning ? `<div class="field-hint">${escapeHtml(f.meaning)}</div>` : "";
              let control = "";
              if (f.type === "select") {
                const opts = (f.options || [])
                  .map(
                    (o) =>
                      `<option value="${escapeHtml(o)}" ${val === o ? "selected" : ""}>${escapeHtml(o)}</option>`
                  )
                  .join("");
                control = `<select class="field-input" data-input="${f.id}" ${writable ? "" : "disabled"}>
                  <option value="">—</option>${opts}</select>`;
              } else if (f.type === "textarea") {
                control = `<textarea class="field-input" data-input="${f.id}" ${writable ? "" : "readonly"} placeholder="${escapeHtml(f.placeholder || "")}">${escapeHtml(val)}</textarea>`;
              } else {
                control = `<input class="field-input" data-input="${f.id}" type="${escapeHtml(f.type || "text")}" value="${escapeHtml(val)}" placeholder="${escapeHtml(f.placeholder || "")}" ${writable ? "" : "readonly"} />`;
              }
              return `<div class="field open" data-field="${f.id}">
                <div class="field-label">${escapeHtml(f.label)}</div>
                ${control}
                ${meaning}
              </div>`;
            })
            .join("")}
        </div>
      </section>`
    )
    .join("");

  els.sections.querySelectorAll("[data-input]").forEach((input) => {
    const sync = () => {
      state.values[input.getAttribute("data-input")] = input.value;
      persist();
      paintStatus();
      // 不在此重繪 action-row：blur→change 會拆掉正在點的按鈕
    };
    input.addEventListener("input", sync);
    input.addEventListener("change", sync);
  });

  paintStatus();
  renderActions();
  renderRoleTabs();
}

function persist() {
  saveDoc({ values: state.values, updatedAt: new Date().toISOString() });
}

function paintStatus() {
  els.statusPill.textContent = status();
}

function renderRoleTabs() {
  els.roleTabs.innerHTML = (data.roles || [])
    .map(
      (r) =>
        `<button type="button" class="role-tab ${r.id === state.roleId ? "active" : ""}" data-role="${r.id}">${escapeHtml(r.label)}</button>`
    )
    .join("");
  els.roleTabs.querySelectorAll("[data-role]").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.roleId = btn.getAttribute("data-role");
      buildRealForm();
    });
  });
}

function actionAvailable(action) {
  if (action.role !== state.roleId) return false;
  const st = status();
  const when = action.whenStatus || [];
  return when.includes(st) || (when.includes("") && (!st || st === "草稿"));
}

function renderActions() {
  const acts = (data.actions || []).filter(actionAvailable);
  els.submitRow.classList.remove("open");
  if (!acts.length) {
    els.actionRow.classList.remove("open");
    els.actionRow.innerHTML = `<span class="progress">目前角色在「${escapeHtml(status())}」沒有可做的動作</span>`;
    els.actionRow.classList.add("open");
    return;
  }
  els.actionRow.classList.add("open");
  els.actionRow.innerHTML = acts
    .map(
      (a) =>
        `<button type="button" class="primary-btn" data-action-id="${a.id}">${escapeHtml(a.label)}</button>`
    )
    .join("") +
    `<button type="button" class="ghost-btn" id="btn-reset-doc">清空重填</button>`;
  els.actionRow.querySelectorAll("[data-action-id]").forEach((btn) => {
    btn.addEventListener("click", () => runAction(btn.getAttribute("data-action-id")));
  });
  document.getElementById("btn-reset-doc")?.addEventListener("click", () => {
    if (!confirm("清空這張單，從頭開始？")) return;
    state.values = { final_status: "草稿" };
    persist();
    buildRealForm();
    toast("已清空");
  });
}

function runAction(actionId) {
  const action = data.actions.find((a) => a.id === actionId);
  if (!action || !actionAvailable(action)) return;

  for (const req of action.require || []) {
    if (!String(state.values[req] || "").trim()) {
      const f = fieldById(req);
      toast(`請先填「${f?.label || req}」`);
      document.querySelector(`[data-input="${req}"]`)?.focus();
      return;
    }
  }

  const role = roleOf(state.roleId);
  for (const id of action.autoPersona || []) {
    state.values[id] = role?.persona || role?.label || "";
  }
  for (const id of action.autoToday || []) {
    state.values[id] = today();
  }
  Object.assign(state.values, action.set || {});
  persist();
  buildRealForm();
  toast(action.message || "已完成");
}

function setMode(mode) {
  state.mode = mode;
  els.app.dataset.mode = mode;
  document.querySelectorAll(".mode-tab[data-mode]").forEach((btn) => {
    btn.classList.toggle("active", btn.getAttribute("data-mode") === mode);
  });
  els.tap.hidden = mode !== "show";
  clearSummary();

  if (mode === "show") {
    els.eyebrow.textContent = "邊講邊填 · Show";
    els.formSub.textContent = "空白開始 · 一欄一欄填進去";
    els.actionRow.classList.remove("open");
    els.actionRow.innerHTML = "";
    state.typeToken += 1;
    state.nodeId = data.start;
    state.values = {};
    state.unlocked = new Set();
    state.openSections = new Set(["apply"]);
    state.stepCount = 0;
    buildShowForm();
    document.getElementById("sec-apply")?.classList.add("open");
    paintShowForm();
    renderNode();
  } else {
    els.eyebrow.textContent = "真實表單 · 統一系統";
    els.actor.classList.remove("show");
    els.submitRow.classList.remove("open");
    buildRealForm();
  }

  const url = new URL(location.href);
  url.searchParams.set("mode", mode);
  history.replaceState(null, "", url);
}

function bindChrome() {
  document.querySelectorAll(".mode-tab[data-mode]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      setMode(btn.getAttribute("data-mode"));
    });
  });
  els.tap.addEventListener("click", advance);
  document.getElementById("btn-restart")?.addEventListener("click", () => {
    if (state.mode === "show") restartShow();
    else {
      state.values = { final_status: "草稿" };
      persist();
      buildRealForm();
      toast("已重來");
    }
  });
  document.addEventListener("keydown", (e) => {
    if (state.mode !== "show") return;
    if (e.key === "Enter" || e.key === " " || e.key === "ArrowRight") {
      const node = data.nodes[state.nodeId];
      if (!node?.choices && !node?.ending && !state.busy) {
        e.preventDefault();
        advance();
      }
    }
  });
}

els.title.textContent = data.title;
const bootMode = new URLSearchParams(location.search).get("mode");
bindChrome();
setMode(bootMode === "form" ? "form" : "show");

  </script>
</body>
</html>
