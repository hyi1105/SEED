<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>系統導覽 — SEED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=build13" />
</head>
<body>
  <div class="dash">
    <header class="topbar">
      <a class="back" href="../index.html">SEED</a>
      <div class="brand">
        <p class="eyebrow" id="mode-eyebrow">System Walkthrough</p>
        <h1 id="sys-title">離職單</h1>
      </div>
      <div class="mode-tabs" role="tablist" aria-label="認識方式">
        <button type="button" class="mode-tab" data-mode="guide" role="tab" aria-selected="false">導引</button>
        <button type="button" class="mode-tab active" data-mode="map" role="tab" aria-selected="true">地圖</button>
        <button type="button" class="mode-tab" data-mode="slide" role="tab" aria-selected="false">簡報</button>
        <button type="button" class="mode-tab" data-mode="demo" role="tab" aria-selected="false">演示</button>
      </div>
    </header>

    <div class="view view-map" id="view-map" data-active="true">
      <div class="map-shell" id="map-shell">
        <div class="map-toolbar" aria-label="地圖控制">
          <button type="button" id="zoom-out" title="縮小">−</button>
          <button type="button" id="zoom-in" title="放大">+</button>
          <button type="button" id="zoom-fit" title="適合畫面">適合</button>
          <button type="button" id="layout-reset" title="重設版面">重設版面</button>
        </div>
        <div class="legend float-legend" id="action-legend"></div>
        <div class="viewport" id="viewport">
          <div class="world" id="world">
            <svg class="edges-svg" id="edges-svg" aria-hidden="true"></svg>
            <div class="entities" id="lineage-canvas"></div>
          </div>
        </div>
        <p class="map-hint" id="map-hint">單指拖地圖 · 雙指縮放 · 切換步驟不會移動鏡頭</p>
      </div>
    </div>

    <div class="view view-paper" id="view-paper" data-active="false" hidden>
      <div class="paper-toolbar">
        <p class="paper-caption" id="paper-caption">一情境一張作業紙</p>
        <div class="demo-controls" id="demo-controls" hidden>
          <button type="button" id="demo-restart" class="ghost">重來</button>
          <button type="button" id="demo-play" class="primary">▶ 播放演示</button>
        </div>
      </div>
      <div class="paper-scroll">
        <div class="paper-stage">
          <article class="paper" id="paper-form" aria-label="作業紙表單"></article>
          <aside class="paper-guide" id="paper-guide" aria-label="填寫順序說明"></aside>
        </div>
      </div>
      <p class="demo-live" id="demo-live" hidden aria-live="polite"></p>
    </div>

    <div class="view view-guide" id="view-guide" data-active="false" hidden>
      <div class="guide-layout">
        <aside class="guide-rail">
          <p class="guide-rail-title">教學階段</p>
          <ol class="guide-phases" id="guide-phases"></ol>
        </aside>
        <div class="guide-main">
          <p class="guide-kicker" id="guide-kicker">漸進拼圖 · 先想再選再長出</p>
          <h2 id="guide-phase-title">導引</h2>
          <p class="guide-goal" id="guide-phase-goal"></p>
          <section class="guide-stage" id="guide-stage" aria-label="系統拼圖舞台">
            <div class="guide-stage-head">
              <h3 id="guide-stage-title">系統拼圖</h3>
              <p id="guide-stage-hint"></p>
            </div>
            <div class="guide-stage-banner" id="guide-stage-banner" hidden></div>
            <div class="guide-zones" id="guide-zones"></div>
          </section>
          <div class="guide-story" id="guide-story"></div>
          <div class="guide-quiz" id="guide-quiz"></div>
          <div class="guide-feedback" id="guide-feedback" hidden></div>
          <div class="guide-reveal" id="guide-reveal" hidden>
            <div class="guide-turns" id="guide-turns"></div>
            <div class="guide-acl" id="guide-acl" hidden></div>
            <div class="guide-file" id="guide-file" hidden></div>
            <p class="guide-tip" id="guide-tip" hidden></p>
          </div>
          <div class="guide-nav">
            <button type="button" id="guide-prev" class="ghost">上一關</button>
            <button type="button" id="guide-next" class="primary">下一關</button>
            <button type="button" id="guide-cta" class="primary" hidden>打開催收系統導覽</button>
          </div>
        </div>
      </div>
    </div>

    <section class="sheet" id="sheet" data-open="true">
      <button type="button" class="sheet-handle" id="sheet-toggle" aria-expanded="true">
        <span class="grip" aria-hidden="true"></span>
        <span id="sheet-title">導覽面板</span>
      </button>

      <div class="sheet-body">
        <p class="top-sub sheet-sub" id="sys-sub">導引設計 · 地圖認識 · 簡報全覽 · 演示照做</p>
        <div class="controls">
          <label class="ctrl">
            <span>系統</span>
            <select id="system-select">
              <option value="resignation">離職單</option>
              <option value="collection">催收單</option>
            </select>
          </label>
          <label class="ctrl">
            <span>角色</span>
            <select id="role-select"></select>
          </label>
          <label class="ctrl">
            <span>情境</span>
            <select id="scenario-select"></select>
          </label>
        </div>
        <p class="scenario-summary" id="scenario-summary"></p>
        <p class="chain" id="scenario-chain" hidden></p>

        <div class="steps-head">
          <h2>操作步驟</h2>
          <div class="step-nav">
            <button type="button" id="btn-prev" class="ghost">上一步</button>
            <button type="button" id="btn-next" class="primary">下一步</button>
          </div>
        </div>
        <ol class="steps" id="steps-list"></ol>
        <div class="step-detail">
          <p class="step-note" id="step-note">選擇情境後，逐步看欄位如何被點亮。</p>
          <ul class="risks" id="step-risks" hidden></ul>
        </div>

        <div class="coverage" id="coverage-block">
          <h2>欄位覆蓋</h2>
          <p class="hint">從未被步驟碰到的欄位＝候選死欄位。</p>
          <div class="coverage-grid" id="coverage-grid"></div>
        </div>
      </div>
    </section>
  </div>

  "subtitle": "四合院式記憶：一塊一塊長出來——先想、再選、再長出陌生名稱與用途",
  "example": "催收系統",
  "targetSystem": "systems/collection.json",
  "style": "build-qa",
  "build": {

        "label": "申請端",
        "role": "申請人開單",
        "order": 1
      },
      {
        "id": "collect",
        "label": "催收接力",
        "role": "一／二／三催",
        "order": 2
      },
      {
        "id": "close",
        "label": "結案",
        "role": "交付與完成",
        "order": 3
      },
      {
        "id": "acl",
        "label": "誰能动",
        "role": "權限圍牆",
        "order": 4
      },
      {
        "id": "pack",
        "label": "系統包",
        "role": "可播放檔案",
        "order": 5
      }
    ]

  "phases": [
    {
      "id": "hear",
      "title": "1. 先長申請端",
      "goal": "先聽原話，把申請人會填的名稱釘在「申請端」這塊地上。",
      "story": "空地上還什麼都沒有。有人說：「我想做催收系統。申請人要填姓名、部門、職位、系統名稱、預計催收日、區域。」",
      "quiz": {
        "ask": "第一塊該先長什麼？",
        "choices": [
          {
            "id": "a",
            "text": "申請人會填的六個基本欄位（使用者原話清單）",
            "correct": true
          },
          {
            "id": "b",
            "text": "立刻長出完整資料庫與所有 API",
            "correct": false
          },
          {
            "id": "c",
            "text": "先長漂亮畫面，欄位名稱以後再說",
            "correct": false
          }
        ],
        "explainCorrect": "對。先把陌生名稱釘在「申請端」——這是整座系統的地基。",
        "explainWrong": "太早長技術或畫面，名稱會飄掉。先原話、先申請端。"
      },
      "reveal": {
        "banner": "申請端長出來了",
        "zone": "applicant",
        "pieces": [

          { "id": "dept", "label": "部門", "kind": "field", "note": "申請人填" },
          { "id": "title", "label": "職位", "kind": "field", "note": "申請人填" },
          { "id": "system_name", "label": "系統名稱", "kind": "field", "note": "催哪個系統" },
          { "id": "expect_date", "label": "預計催收日", "kind": "field", "note": "預期時程" },
          { "id": "area", "label": "區域", "kind": "field", "note": "業務範圍" }
        ]
      },
      "tip": "記名稱的方法：名稱永遠掛在它所屬的「院子區塊」上。",
      "turns": [
        {
          "who": "user",
          "text": "我想做一個催收系統。申請人要填：姓名、部門、職位、系統名稱、預計催收日、區域。"
        },
        {
          "who": "guide",
          "text": "申請端這進院先立好。接下來要問：催收本身要不要分階段？"
        }
      ]
    },
    {
      "id": "enrich",
      "title": "2. 長出催收與結案",
      "goal": "使用者沒講完的，顧問補「這種流程一定會漏」的名稱與用途。",
      "story": "申請端已在。但催收很少一次結束——通常有一催、二催、三催，最後還要交付／完成日。",
      "quiz": {
        "ask": "下一進院最該主動長出哪些名稱？",
        "choices": [
          {
            "id": "a",
            "text": "一／二／三催的狀態與日期，再加上最終交付日、催收完成日",
            "correct": true
          },
          {
            "id": "b",
            "text": "只要再加一個「備註」就夠了",
            "correct": false
          },
          {
            "id": "c",
            "text": "把預計催收日拆掉，改成自由文字",
            "correct": false
          }
        ],
        "explainCorrect": "對。催收接力與結案，是「用途」真正開始分層的地方。",
        "explainWrong": "只有備註或刪日期，之後無法分工、無法結案對帳。"
      },
      "reveal": {
        "banner": "催收接力與結案長出來了",
        "zone": "collect",
        "alsoUnlock": ["close"],
        "pieces": [
          { "id": "c1_status", "label": "一催狀態", "kind": "field", "zone": "collect", "note": "新增·進度", "tag": "新增" },

          { "id": "c2_status", "label": "二催狀態", "kind": "field", "zone": "collect", "note": "新增·進度", "tag": "新增" },

          { "id": "c3_status", "label": "三催狀態", "kind": "field", "zone": "collect", "note": "新增·進度", "tag": "新增" },
          { "id": "c3_date", "label": "三催日期", "kind": "field", "zone": "collect", "note": "新增·時點", "tag": "新增" },
          { "id": "final_delivery", "label": "最終交付日", "kind": "field", "zone": "close", "note": "新增·結案", "tag": "新增" },
          { "id": "done_date", "label": "催收完成日", "kind": "field", "zone": "close", "note": "新增·結案", "tag": "新增" }
        ]
      },
      "tip": "使用者講「要什麼」；顧問補「這種流程一定會漏的名稱」。",
      "turns": [
        {
          "who": "guide",
          "text": "催收通常不是一次結束。建議加上一／二／三催的狀態與日期，以及最終交付日、催收完成日。"
        }
      ]
    },
    {
      "id": "acl-applicant",
      "title": "3. 圍申請人的牆",
      "goal": "送出之後：申請人能看什麼、不能改什麼——權限也是要「長」出來的結構。",
      "story": "欄位院子已經成形。申請人把基本資料送出了，一催狀態開始有人填。你要問清楚權限。",
      "quiz": {
        "ask": "申請人這道牆，比較合理的開口是？",
        "choices": [
          {
            "id": "a",
            "text": "基本資料鎖定；催收狀態／日期可看結果但不能改",
            "correct": true
          },
          {
            "id": "b",
            "text": "申請人隨時可改所有催收狀態",
            "correct": false
          },
          {
            "id": "c",
            "text": "申請人完全看不到催收進度",
            "correct": false
          }
        ],
        "explainCorrect": "對。可看結果、不可改——責任才分得清。",
        "explainWrong": "讓申請人改催收會亂帳；完全看不到又無法對進度。"
      },
      "reveal": {
        "banner": "申請人權限牆立起來了",
        "zone": "acl",
        "pieces": [
          {
            "id": "acl_app_base",
            "label": "申請欄：送出後鎖定",
            "kind": "acl",
            "note": "看得到／不可再改"
          },
          {
            "id": "acl_app_prog",
            "label": "催收進度：只看不編",
            "kind": "acl",
            "note": "結果可見、責任在催收"
          }
        ]
      },
      "acl": {
        "role": "申請人",
        "rows": [
          { "field": "姓名／部門／職位／系統／預計日／區域", "view": "可看", "edit": "送出前可編；送出後鎖定" },
          { "field": "一催／二催／三催 狀態與日期", "view": "可看結果", "edit": "不可編" },
          { "field": "最終交付日／催收完成日", "view": "可看", "edit": "不可編" }
        ]
      },
      "turns": [
        {
          "who": "guide",
          "text": "申請人送單之後：哪些不能再改？哪些催收欄位只能看？"
        },
        {
          "who": "user",
          "text": "基本資料送出後鎖定。一／二／三催狀態與日期只能看、不能改。"
        }
      ]
    },
    {
      "id": "acl-collectors",
      "title": "4. 切開催收人的門",
      "goal": "一催、二催、三催各自只能進自己的門——對立／分工從這裡來。",
      "story": "現在有一催、二催、三催三位要接力。若門沒切開，大家會互相改欄位。",
      "quiz": {
        "ask": "催收人的門，哪一種最像可用的對立流程？",
        "choices": [
          {
            "id": "a",
            "text": "一催只編一催欄；二催只編二催；三催只編三催；結案才編交付／完成日",
            "correct": true
          },
          {
            "id": "b",
            "text": "三位催收人都可改全部催收欄位",
            "correct": false
          },
          {
            "id": "c",
            "text": "只有申請人能改催收狀態",
            "correct": false
          }
        ],
        "explainCorrect": "對。每關只開自己的門，名稱才綁得住責任。",
        "explainWrong": "全都能改＝無法追責；申請人改催收＝角色錯位。"
      },
      "reveal": {
        "banner": "催收人的門切開了",
        "zone": "acl",
        "pieces": [
          { "id": "acl_c1", "label": "一催門 → 只編一催", "kind": "acl", "note": "各催各欄" },
          { "id": "acl_c2", "label": "二催門 → 只編二催", "kind": "acl", "note": "各催各欄" },
          { "id": "acl_c3", "label": "三催門 → 只編三催", "kind": "acl", "note": "各催各欄" },
          { "id": "acl_close", "label": "結案門 → 交付／完成日", "kind": "acl", "note": "收尾角色" }
        ]
      },
      "acl": {
        "role": "催收人／結案",
        "rows": [
          { "field": "申請基本資料", "view": "可看", "edit": "不可編" },
          { "field": "一催狀態／日期", "view": "全員可看", "edit": "僅一催可編" },
          { "field": "二催狀態／日期", "view": "全員可看", "edit": "僅二催可編" },
          { "field": "三催狀態／日期", "view": "全員可看", "edit": "僅三催可編" },
          { "field": "最終交付日／催收完成日", "view": "可看", "edit": "僅結案角色可編" }
        ]
      },
      "turns": [
        {
          "who": "guide",
          "text": "一催只能填一催欄位嗎？二催、三催呢？結案誰填？"
        },
        {
          "who": "user",
          "text": "一催改一催、二催改二催、三催改三催；結案填最終交付日與完成日。"
        }
      ]
    },
    {
      "id": "pack",
      "title": "5. 收成可攜檔",
      "goal": "院子要收成 system.json，才能搬家到任何播放器／平台。",
      "story": "名稱、用途、權限都談完了。下一步不是寫死一個畫面，而是先產出「系統包」。",
      "quiz": {
        "ask": "這份檔案最該帶走哪些東西？",
        "choices": [
          {
            "id": "a",
            "text": "表／欄位、角色、情境步驟（含誰在哪步動哪欄）、演示假資料",
            "correct": true
          },
          {
            "id": "b",
            "text": "只要一張截圖就夠交接",
            "correct": false
          },
          {
            "id": "c",
            "text": "只留程式碼，不要欄位說明",
            "correct": false
          }
        ],
        "explainCorrect": "對。JSON 系統包＝名稱／用途／步驟可驗證、可播放。",
        "explainWrong": "截圖與裸程式不好問「誰能改哪欄」。"
      },
      "reveal": {
        "banner": "系統包成形了",
        "zone": "pack",
        "pieces": [
          { "id": "pack_ent", "label": "entities 欄位", "kind": "pack", "note": "名稱與表" },

          { "id": "pack_demo", "label": "demo 假資料", "kind": "pack", "note": "可演示" }
        ]
      },
      "filePreview": {
        "name": "systems/collection.json",
        "bullets": [
          "entities：催收單主檔（含一～三催與結案欄位）",
          "roles：申請人／一催／二催／三催／結案",
          "scenarios：申請開單 → 一催 → 二催 → 三催 → 結案",
          "每步附 fill，演示模式可模擬真人填寫"
        ]
      },
      "turns": [
        {
          "who": "guide",
          "text": "依 SKILL／Schema 產出 JSON：表、欄位、角色、情境步驟、演示假資料——這就是可攜系統包。"
        }
      ]
    },
    {
      "id": "ready",
      "title": "6. 走進真實系統",
      "goal": "抽象拼圖學會後，走進可上手系統：地圖／簡報／演示驗證每個名稱怎麼被用。",
      "story": "模型院子已蓋完。最後一步：用角色×情境走一遍，確認名稱不是「長得像」，而是「用得出來」。",
      "quiz": {
        "ask": "打開催收導覽後，你最該先驗證哪件事？",
        "choices": [
          {
            "id": "a",
            "text": "換角色走情境：看每欄在哪一步被填、被鎖、被接龍",
            "correct": true
          },
          {
            "id": "b",
            "text": "只看顏色好不好看",
            "correct": false
          },
          {
            "id": "c",
            "text": "立刻加十個新欄位，不要先跑流程",

          }
        ],
        "explainCorrect": "對。從模型走進真實場景——才完成記憶轉移。",
        "explainWrong": "外觀與狂加欄位都不能證明流程可跑。先走申請→一催→二催→三催→結案。"
      },
      "reveal": {
        "banner": "可以走進可用系統了",
        "zone": "pack",
        "pieces": [
          { "id": "ready_map", "label": "地圖驗證", "kind": "pack", "note": "看連線" },
          { "id": "ready_slide", "label": "簡報全覽", "kind": "pack", "note": "紙本順序" },
          { "id": "ready_demo", "label": "演示照做", "kind": "pack", "note": "一步步填" }
        ]
      },
      "cta": {
        "label": "打開催收系統導覽",
        "system": "collection",
        "mode": "map"

      "turns": [
        {
          "who": "guide",
          "text": "打開催收系統：用地圖／簡報／演示，確認每個欄位在對的步驟被對的人使用。"
