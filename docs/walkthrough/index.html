<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>系統導覽 — SEED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=guide11" />
</head>
<body>
  <div class="dash">
    <header class="topbar">
      <a class="back" href="../index.html">SEED</a>
      <div class="brand">
        <p class="eyebrow" id="mode-eyebrow">System Walkthrough</p>
        <h1 id="sys-title">離職單</h1>
      </div>
      <div class="mode-tabs" role="tablist" aria-label="認識方式">
        <button type="button" class="mode-tab" data-mode="guide" role="tab" aria-selected="false">導引</button>
        <button type="button" class="mode-tab active" data-mode="map" role="tab" aria-selected="true">地圖</button>
        <button type="button" class="mode-tab" data-mode="slide" role="tab" aria-selected="false">簡報</button>
        <button type="button" class="mode-tab" data-mode="demo" role="tab" aria-selected="false">演示</button>
      </div>
    </header>

    <div class="view view-map" id="view-map" data-active="true">
      <div class="map-shell" id="map-shell">
        <div class="map-toolbar" aria-label="地圖控制">
          <button type="button" id="zoom-out" title="縮小">−</button>
          <button type="button" id="zoom-in" title="放大">+</button>
          <button type="button" id="zoom-fit" title="適合畫面">適合</button>
          <button type="button" id="layout-reset" title="重設版面">重設版面</button>
        </div>
        <div class="legend float-legend" id="action-legend"></div>
        <div class="viewport" id="viewport">
          <div class="world" id="world">
            <svg class="edges-svg" id="edges-svg" aria-hidden="true"></svg>
            <div class="entities" id="lineage-canvas"></div>
          </div>
        </div>
        <p class="map-hint" id="map-hint">單指拖地圖 · 雙指縮放 · 切換步驟不會移動鏡頭</p>
      </div>
    </div>

    <div class="view view-paper" id="view-paper" data-active="false" hidden>
      <div class="paper-toolbar">
        <p class="paper-caption" id="paper-caption">一情境一張作業紙</p>
        <div class="demo-controls" id="demo-controls" hidden>
          <button type="button" id="demo-restart" class="ghost">重來</button>
          <button type="button" id="demo-play" class="primary">▶ 播放演示</button>
        </div>
      </div>
      <div class="paper-scroll">
        <div class="paper-stage">
          <article class="paper" id="paper-form" aria-label="作業紙表單"></article>
          <aside class="paper-guide" id="paper-guide" aria-label="填寫順序說明"></aside>
        </div>
      </div>
      <p class="demo-live" id="demo-live" hidden aria-live="polite"></p>
    </div>

    <div class="view view-guide" id="view-guide" data-active="false" hidden>
      <div class="guide-layout">
        <aside class="guide-rail">
          <p class="guide-rail-title">教學階段</p>
          <ol class="guide-phases" id="guide-phases"></ol>
        </aside>
        <div class="guide-main">
          <p class="guide-kicker" id="guide-kicker">需求 → 欄位 → 權限 → 成檔 → 可用系統</p>
          <h2 id="guide-phase-title">導引</h2>
          <p class="guide-goal" id="guide-phase-goal"></p>
          <div class="guide-turns" id="guide-turns"></div>
          <div class="guide-board" id="guide-board" hidden></div>
          <div class="guide-acl" id="guide-acl" hidden></div>
          <div class="guide-file" id="guide-file" hidden></div>
          <p class="guide-tip" id="guide-tip" hidden></p>
          <div class="guide-nav">
            <button type="button" id="guide-prev" class="ghost">上一階段</button>
            <button type="button" id="guide-next" class="primary">下一階段</button>
            <button type="button" id="guide-cta" class="primary" hidden>打開催收系統導覽</button>
          </div>
        </div>
      </div>
    </div>

    <section class="sheet" id="sheet" data-open="true">
      <button type="button" class="sheet-handle" id="sheet-toggle" aria-expanded="true">
        <span class="grip" aria-hidden="true"></span>
        <span id="sheet-title">導覽面板</span>
      </button>

      <div class="sheet-body">
        <p class="top-sub sheet-sub" id="sys-sub">導引設計 · 地圖認識 · 簡報全覽 · 演示照做</p>
        <div class="controls">
          <label class="ctrl">
            <span>系統</span>
            <select id="system-select">
              <option value="resignation">離職單</option>
              <option value="collection">催收單</option>
            </select>
          </label>
          <label class="ctrl">
            <span>角色</span>
            <select id="role-select"></select>
          </label>
          <label class="ctrl">
            <span>情境</span>
            <select id="scenario-select"></select>
          </label>
        </div>
        <p class="scenario-summary" id="scenario-summary"></p>
        <p class="chain" id="scenario-chain" hidden></p>

        <div class="steps-head">
          <h2>操作步驟</h2>
          <div class="step-nav">
            <button type="button" id="btn-prev" class="ghost">上一步</button>
            <button type="button" id="btn-next" class="primary">下一步</button>
          </div>
        </div>
        <ol class="steps" id="steps-list"></ol>
        <div class="step-detail">
          <p class="step-note" id="step-note">選擇情境後，逐步看欄位如何被點亮。</p>
          <ul class="risks" id="step-risks" hidden></ul>
        </div>

        <div class="coverage" id="coverage-block">
          <h2>欄位覆蓋</h2>
          <p class="hint">從未被步驟碰到的欄位＝候選死欄位。</p>
          <div class="coverage-grid" id="coverage-grid"></div>
        </div>
      </div>
    </section>
  </div>

  <script type="application/json" id="guide-data">
{
  "title": "從需求對話到可用系統",
  "subtitle": "教學導引：怎麼把「我想做催收系統」變成欄位、權限與可上手流程",

  "phases": [
    {
      "id": "hear",
      "title": "1. 聽需求",
      "goal": "先聽使用者要做什麼，不要急著開表。",
