<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Approval｜A4 填空＋段末小框</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div>
        <h1>簽核｜A4 填空文件</h1>
        <p>段末小對話框＝給未來自己 · 文末小框＝公開討論</p>
      </div>
      <label class="who">
        我是
        <select id="login">
          <option value="u_ming" selected>王小明（申請人）</option>
          <option value="u_lin">林主管</option>
          <option value="u_yen">嚴協理</option>
        </select>
      </label>
    </header>

    <div class="stage">
      <article class="a4" id="doc">

        <h2 class="doc-title">請假申請書</h2>
        <p class="doc-meta">描述句填空＝綁定欄位。段末小框給未來的自己；文末小框給公開討論。</p>

        <section class="block" data-block="apply">
          <p class="para">
            申請人
            <input class="blank" data-bind="applicant" value="王小明" />
            因
            <input class="blank" data-bind="leave_type" value="事假" />
            ，自
            <input class="blank wide" data-bind="leave_date" value="明天" />
            起請假
            <input class="blank narrow" data-bind="days" value="1" />
            天，代理人為
            <input class="blank" data-bind="agent" value="陳美玲" />
            。<button type="button" class="note-ico" data-kind="self" data-block="apply" aria-label="給未來自己的備註"><span class="count">0</span></button>
          </p>
        </section>

        <section class="block" data-block="flow">
          <p class="para narrate">
            系統已排程郵件通知簽核人林主管。此關可簽核、可退回、可換代理人；申請欄位送出後改為唯讀。<button type="button" class="note-ico" data-kind="self" data-block="flow-a" aria-label="給未來自己的備註"><span class="count">0</span></button>
          </p>
          <p class="para narrate">
            變更紀錄：假別由「特休」改為「事假」；日期由空白改為「明天」；天數為「1」。<button type="button" class="note-ico" data-kind="self" data-block="flow-b" aria-label="給未來自己的備註"><span class="count">0</span></button>
          </p>
        </section>

        <section class="block" data-block="sign1">
          <p class="para">
            第一關簽核人
            <input class="blank" data-bind="approver1" value="林主管" />
            ，狀態為
            <input class="blank wide" data-bind="status1" value="等待申請人送出" />
            。簽核意見：
            <input class="blank wider" data-bind="opinion1" value="" placeholder="（填空）" />
            。<button type="button" class="note-ico" data-kind="self" data-block="sign1" aria-label="給未來自己的備註"><span class="count">0</span></button>
          </p>
        </section>

        <section class="block" data-block="sign2">
          <p class="para">
            第二關簽核人
            <input class="blank" data-bind="approver2" value="嚴協理" />
            ，狀態為
            <input class="blank wide" data-bind="status2" value="等待前關完成" />
            。簽核意見：
            <input class="blank wider" data-bind="opinion2" value="" placeholder="（填空）" />
            。<button type="button" class="note-ico" data-kind="self" data-block="sign2" aria-label="給未來自己的備註"><span class="count">0</span></button>
          </p>
        </section>

        <section class="doc-end">
          <p class="end-line">
            —— 文件結束 ——
            <button type="button" class="note-ico public" data-kind="public" data-block="public" aria-label="公開討論"><span class="count">0</span></button>
          </p>
          <p class="end-hint">文末小框＝公開討論（大家看得到）</p>
        </section>

      </article>
    </div>
  </div>

  <!-- 點小框後展開：給未來自己 / 公開討論 -->
  <div class="sheet hidden" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-card">
      <header class="sheet-head">
        <h3 id="sheet-title">給未來的自己</h3>
        <button type="button" class="sheet-x" id="sheet-close" aria-label="關閉">×</button>
      </header>
      <p class="sheet-desc" id="sheet-desc">只有你看得到。像留給以後的自己的書籤。</p>
      <div class="thread" id="sheet-thread"></div>
      <form class="sheet-form" id="sheet-form">
        <input type="text" id="sheet-input" placeholder="寫一句給未來的自己…" autocomplete="off" />
        <button type="submit">留下</button>
      </form>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
