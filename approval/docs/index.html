<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Approval</title>
  <link rel="stylesheet" href="./styles.css?v=json1" />
</head>
<body>
  <!-- 畫面殼：不含申請單文案；全部由 document JSON 渲染 -->
  <div class="app-shell">
    <nav class="view-tabs" id="view-tabs" aria-label="view"></nav>
    <div class="stage" id="view-form" hidden></div>
    <div class="json-stage" id="view-json" hidden>
      <textarea class="json-editor" id="json-editor" spellcheck="false" aria-label="JSON"></textarea>
      <p class="json-msg" id="json-msg" hidden></p>
    </div>
  </div>
  <script src="./app.js?v=json1"></script>
</body>
</html>
